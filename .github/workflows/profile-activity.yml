name: Update contribution activity

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@6411849745757299611a795fef822a31ca8d1d02
        with:
          username: MauricioTaguchi
          options: bg_color=0D1117&color=A78BFA&title_color=A78BFA&line=818CF8&point=C4B5FD&area=true&area_color=6D28D9&hide_border=true&radius=12&custom_title=Maur%C3%ADcio%20Taguchi%20%7C%20Contribution%20Activity
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated SVG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          source = Path("assets/activity-graph.svg").read_text()
          root = ET.fromstring(source)
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "Invalid SVG"
          text = " ".join(root.itertext()).lower()
          for message in ("something unexpected happened", "bad credentials", "rate limit exceeded", "could not resolve"):
              assert message not in text, "Upstream returned an error card"
          assert len(source) > 1000, "Incomplete SVG"
          PY

      - name: Publish activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-graph.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh contribution activity graph"
          git pull --rebase origin main
          git push origin HEAD:main

